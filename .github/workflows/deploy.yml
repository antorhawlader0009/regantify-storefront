name: Deploy

# GitHub only hands the deploy to the VPS and leaves (a few seconds, about 1 billed minute). The VPS builds in the
# background with its own CPU, RAM and 30 GB cache limits, health-checks the new version, rolls back on failure and
# reports the result as the commit status "vps-deploy". Scripts: ~/regantify/deploy/ on the VPS (copy in the workspace
# z-others/vps/deploy/).
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-storefront
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hand the storefront deploy to the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: ~/regantify/deploy/deploy.sh storefront ${{ github.sha }}
